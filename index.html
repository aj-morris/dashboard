<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>My Dashboard</h1>
         <button type="button" id="theme-toggle">Toggle dark mode</button>
    </header>
   <main class="dashboard">
    <section class="widget"> 
        <h2>Sample Weather Display</h2>  
       <div id="weather-display">Loading weather…</div>
    </section>
    <section class="widget">  
        <h2>Quote</h2>
        <div id="quotes-display">Loading quotes…</div>
        <button type="button" id="new-quote-btn" disabled>New quote</button>
    </section>
    <section class="widget">   
        <h2>Tasks</h2>
        <div id="task-stats"></div>
        <form id="task-form">
            <input type="text" id="task-input">
            <button type="submit">Add</button>
        </form>
        <ul id="task-list"></ul>
    </section>
   </main>
    <script src="js/app.js"></script>
</body>
</html>
